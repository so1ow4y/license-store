# ============================================================================
#  ВРЕМЕННЫЙ режим: развёртывание на голом IP, без домена и без HTTPS.
#
#    docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#                   -f docker-compose.iptest.yml up -d
#
#  ЗАЧЕМ ОТДЕЛЬНЫМ ФАЙЛОМ. Всё, что здесь есть, придётся выбросить, как
#  только появится домен. Разложи это по prod-файлу — и через неделю никто
#  не вспомнит, какие послабления были временными, а какие осознанными.
#  Отдельный файл выбрасывается целиком, одной строкой в команде.
#
#  ЧЕМ ЭТОТ РЕЖИМ ПЛОХ — прямо и без смягчений:
#
#    • Весь трафик идёт ОТКРЫТЫМ ТЕКСТОМ через интернет: пароль при входе,
#      токены доступа, sessionKey в теле запроса за payload. Кто угодно на
#      пути видит всё. Шифрование payload при этом теряет смысл целиком:
#      ключ выводится из sessionKey, а он летит рядом в открытую.
#    • Хранилище выставлено наружу портом 9000 — иначе presigned-ссылки на
#      загрузку не открылись бы ни у кого, кроме самого сервера.
#
#  ДОПУСТИМО ТОЛЬКО пока систему трогаешь ты один. Ни одного настоящего
#  покупателя, ни одного настоящего пароля, который используется где-то ещё.
#  Появился домен — этот файл убирается, пароль администратора меняется.
# ============================================================================

services:
  s3:
    # Порт возвращается, хотя prod-файл его снял: без публичного адреса
    # хранилища админский путь загрузки payload не работает вовсе.
    ports: !override
      - "9000:9000"

  nginx:
    # 443 не публикуем: сертификата нет, слушать там нечего. Скрипт
    # 25-tls-optional.envsh сам уберёт TLS-конфиг, и nginx поднимется на 80.
    ports: !override
      - "80:80"

  # Почтовая ловушка. В боевом файле её нет (profiles: never), здесь
  # возвращается: без работающего SMTP регистрация не завершается —
  # пользователь создаётся, но подтвердить почту нечем, и войти он не может.
  #
  # Ловушка ничего не отправляет наружу: она принимает письма и показывает
  # их в браузере на порту 8025. Для проверки регистрации этого достаточно,
  # а настоящий SMTP можно завести позже, к боевому запуску.
  mailpit:
    profiles: !override []
    ports: !override
      - "8025:8025"
