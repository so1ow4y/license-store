# ============================================================================
#  ВРЕМЕННО: почтовая ловушка в боевом окружении.
#
#    docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#                   -f docker-compose.mailtrap.yml up -d
#
#  ЗАЧЕМ ОТДЕЛЬНЫМ ФАЙЛОМ. Боевой файл выключает mailpit профилем «never»,
#  и это правильно: в бою письма обязаны уходить через настоящий SMTP.
#  Но пока провайдер отправки не выбран, выключение mailpit означает, что
#  письма не уходят НИКУДА — а от них зависит регистрация: без подтверждения
#  адреса человек не войдёт. Тихо сломать регистрацию в момент переезда на
#  домен хуже, чем на день оставить ловушку.
#
#  Отдельный файл, а не правка боевого, ровно по той же причине, что и
#  docker-compose.iptest.yml: временное послабление должно выбрасываться
#  одной строкой в команде, а не разыскиваться потом по всему конфигу.
#
#  ЧЕМ ЭТО ПЛОХО, ПРЯМО:
#    • письма никому не доставляются — они оседают в ловушке;
#    • смотреть их можно только через ssh-туннель к порту 8025;
#    • покупатель, зарегистрировавшийся сам, подтверждения не получит.
#
#  УБРАТЬ, как только в .env.production появятся настоящие SMTP_HOST,
#  SMTP_USER и SMTP_PASSWORD. Признак, что файл больше не нужен:
#  SMTP_HOST перестал быть равен «mailpit».
# ============================================================================

services:
  mailpit:
    profiles: !override []
    # Наружу НЕ публикуем даже здесь: в письмах ходят ссылки на подтверждение
    # почты и сброс пароля, и открытый ящик отдаёт чужие аккаунты любому.
    # Смотреть через туннель: ssh -L 8125:localhost:8025 root@<сервер>
    ports: !override []
