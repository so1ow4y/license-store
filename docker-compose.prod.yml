# ============================================================================
#  Боевая конфигурация. Накладывается поверх docker-compose.yml:
#
#    docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
#  Чем отличается от разработки — три вещи, и все три важны:
#
#  1. НАРУЖУ ТОРЧИТ ТОЛЬКО NGINX. В разработке Postgres, Redis и S3
#     публикуют порты на хост, чтобы в них можно было заглянуть с машины.
#     На сервере это открытая база в интернет. Здесь порты убраны, и
#     сервисы доступны только внутри docker-сети.
#
#  2. API РАБОТАЕТ В КОНТЕЙНЕРЕ. В разработке он запускается нативно ради
#     горячей перезагрузки; здесь — из собранного образа, как и поедет.
#
#  3. ПАМЯТЬ УРЕЗАНА ПОД 2 ГБ. Значения из docker-compose.yml рассчитаны
#     на рабочую машину с 30 ГБ. На сервере с двумя гигабайтами
#     shared_buffers=512MB у Postgres — это половина всей памяти, и первый
#     же всплеск запусков положит либо его, либо API.
# ============================================================================

services:
  postgres:
    # Порт наружу не публикуется: единственный клиент — API в той же сети.
    ports: !override []
    command:
      - postgres
      - -c
      # Посчитано по ФАКТУ на боевой машине, а не на глаз.
      # free -h на чистом сервере: всего 1,9 ГБ, система заняла 481 МБ,
      # свободно 1,4 ГБ. Раскладка лимитов под этот остаток:
      #   postgres 448 + api 576 + s3 192 + redis 128 + nginx ~48 = 1392 МБ.
      # Первая версия этого файла назначала 2180 МБ — в полтора раза больше,
      # чем есть. Лимиты не резервируют память, поэтому сразу бы не упало:
      # они сложились бы под нагрузкой и выбили Postgres рукой OOM-killer'а.
      - shared_buffers=128MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=48MB
      - -c
      # 30 вместо 200: больше просто некому — клиент один, пул Prisma берёт
      # около десятка. Каждое соединение стоит памяти сверх shared_buffers.
      - max_connections=30
      - -c
      - random_page_cost=1.1
      - -c
      - log_min_duration_statement=500
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    mem_limit: 448m

  redis:
    ports: !override []
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    mem_limit: 128m

  s3:
    ports: !override []
    mem_limit: 192m

  # Почтовая ловушка нужна только в разработке. В бою письма уходят через
  # настоящий SMTP из .env.production.
  mailpit:
    profiles: ["never"]

  # ===========================================================================
  #  ПОЧТА. Три контейнера из двух своих образов.
  #
  #    postfix     (роль out) — отправитель платформы. Портов наружу НЕТ.
  #    postfix-mx  (роль mx)  — приёмник. Порты 25 и 587 опубликованы.
  #    opendkim               — подпись. Единственное место, где лежит ключ.
  #
  #  ЗАЧЕМ ОТДЕЛЬНЫЙ ОТПРАВИТЕЛЬ. Nodemailer — SMTP-КЛИЕНТ: он умеет отдать
  #  письмо серверу, но не умеет искать MX получателя и доставлять сам. Нужен
  #  агент доставки, и это postfix.
  #
  #  ЗАЧЕМ РАЗДЕЛЕНЫ ОТПРАВИТЕЛЬ И ПРИЁМНИК. Не ради красоты. Docker публикует
  #  порты в обход ufw, и при части конфигураций входящее соединение приходит
  #  в контейнер С АДРЕСА ШЛЮЗА docker-сети. Отправителю нужен permit_mynetworks
  #  с подсетью compose — иначе API не сможет отдать письмо. Если бы это была
  #  одна и та же настройка, что и у публичного порта, весь интернет оказался
  #  бы «своей сетью»: открытый релей, работающий с той минуты, как опубликован
  #  порт 25. Разнесение ролей делает эту ошибку невозможной — permit_mynetworks
  #  живёт только там, где нет портов.
  #
  #  ПОЧЕМУ НЕ boky/postfix. Тот образ перегенерирует main.cf при каждом старте,
  #  и ни одна настройка приёма (virtual_alias_domains, пустой mydestination,
  #  postscreen, submission, SASL) в его переменные не выведена. Плюс `:latest`
  #  — подвижная цель: живая доставка проверена для того образа, который
  #  скачался в тот день, а следующий `pull` притащил бы другой.
  #  Подробности — в docker/mail/Dockerfile.
  # ===========================================================================

  # ---------------------------------------------------------------------------
  #  Роль out: отправка почты платформы наружу.
  #
  #  ИМЯ СЕРВИСА ОБЯЗАНО ОСТАВАТЬСЯ «postfix», БЕЗ ТОЧКИ. mail.service.ts
  #  отличает свой релей от чужого провайдера ровно так:
  #      internalRelay = !env.SMTP_HOST.includes('.')
  #  Точка в имени включит проверку TLS-сертификата, и API перестанет
  #  отправлять с ошибкой «self-signed certificate».
  #
  #  Портов наружу нет и появиться не должно: единственный клиент — API
  #  в той же сети compose.
  # ---------------------------------------------------------------------------
  postfix:
    # Свой образ вместо boky/postfix. Тег local, а не latest: образ собирается
    # на сервере из этого репозитория и ниоткуда не тянется.
    image: lp-mail:local
    build:
      context: ./docker/mail
      dockerfile: Dockerfile
    container_name: lp-postfix
    restart: always
    profiles: ["mail"]
    environment:
      MAIL_ROLE: out
      MAIL_DOMAIN: ${MAIL_DOMAIN:-pxcheats.com}
      # Имя в HELO. Совпадает с тем, что видел Gmail, когда принимал наши
      # письма с первой попытки. Менять только отдельным изменением с
      # отдельной живой проверкой.
      MAIL_HOSTNAME: ${MAIL_DOMAIN:-pxcheats.com}
      # Кому разрешено сдавать письма без пароля. Подробное обоснование
      # широкого диапазона — в docker/mail/conf/out/main.cf.
      MAIL_INTERNAL_NETWORKS: ${MAIL_INTERNAL_NETWORKS:-127.0.0.0/8 172.16.0.0/12}
    volumes:
      # Сертификат общий с nginx и только для чтения. Нужен, чтобы предлагать
      # STARTTLS соединению от API — ровно как это делал прежний образ.
      # Каталога может не быть: тогда entrypoint выключает TLS и пишет об этом
      # в журнал, а отправка продолжает работать (трафик не покидает хост).
      - ./docker/nginx/certs:/etc/postfix/certs:ro
      # Очередь переживает пересоздание контейнера.
      #
      # ЧТО К ПРОБЛЕМЕ ВЕЛО: тома здесь не было, а обоснование «письма наши и
      # повторятся из таблицы notifications» неверно. Обработчик ставит
      # статус SENT в момент, когда postfix ответил 250, — то есть когда
      # письмо ПРИНЯТО В ОЧЕРЕДЬ, а не доставлено. Всё, что postfix принял и
      # ещё не отдал получателю (Gmail ответил 4xx, DNS не отвечает, милтер
      # был недоступен), исчезало вместе с контейнером при каждой выкладке —
      # а в базе это выглядело как успешно отправленное. Повторить нечем:
      # SENT обработчик не берёт.
      - postfix_out_spool:/var/spool/postfix
    depends_on:
      # service_started, а НЕ service_healthy.
      #
      # ЧТО К ПРОБЛЕМЕ ВЕЛО: было service_healthy. Проверка здоровья
      # opendkim — однострочник на bash (/dev/tcp), и её отказ по любой
      # причине — от особенностей сборки bash до временно занятого демона —
      # означал `dependency failed to start`: КОНТЕЙНЕР ОТПРАВИТЕЛЯ НЕ
      # СОЗДАВАЛСЯ ВОВСЕ, то есть отправка платформы умирала целиком. При
      # этом deploy.sh глушит этот исход жёлтым предупреждением и идёт
      # дальше, а проверки после выкладки щупают /health/live, а не SMTP.
      #
      # «Стартовать и подождать подписанта» строго лучше: пока opendkim
      # поднимается, postfix отвечает API 4xx (milter_default_action=tempfail),
      # обработчик повторит письмо через минуту, и оно уйдёт подписанным.
      opendkim:
        condition: service_started
    # 64 МБ хватает: default_process_limit = 10, пул nodemailer — 3 соединения.
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  #  Роль mx: приём почты для pxcheats.com.
  #
  #  Адреса support@, dmarc@, postmaster@, abuse@ пересылаются на MAIL_FORWARD_TO.
  #  Всё остальное отвергается кодом 550 в момент RCPT TO — принять и отбить
  #  нельзя: адрес отправителя у ботов подделан, отлуп уйдёт невиновному, и
  #  мы окажемся в чёрных списках как источник спама.
  # ---------------------------------------------------------------------------
  postfix-mx:
    image: lp-mail:local
    build:
      context: ./docker/mail
      dockerfile: Dockerfile
    container_name: lp-postfix-mx
    restart: always
    profiles: ["mail"]
    ports:
      # ЯВНО указан адрес, то есть ТОЛЬКО IPv4. AAAA у mail.pxcheats.com нет,
      # входящих по IPv6 не будет, а IPv6-путь docker — как раз тот, где
      # адрес источника теряется чаще всего и превращается в адрес шлюза.
      #
      # ЗАЧЕМ ЗДЕСЬ ПЕРЕМЕННАЯ, А НЕ ПРИКОЛОЧЕННЫЙ 0.0.0.0. План выкладки
      # требовал проверить приёмник на открытый релей «с чужой машины» — но
      # чужая машина может достучаться только после того, как порт уже открыт
      # в интернет. Проверка получалась после того, как последствия ошибки уже
      # наступили: открытый релей находят сканеры за часы, а из чёрных списков
      # выходят неделями, вместе с отправкой всей платформы.
      #
      # С переменной порядок обратный: MAIL_MX_BIND=127.0.0.1 поднимает
      # приёмник недостижимым снаружи, релей проверяется с самого сервера, и
      # только потом значение меняется на 0.0.0.0.
      #
      # ПОЧЕМУ ПРОВЕРКА С ПЕТЛИ СТРОЖЕ, А НЕ СЛАБЕЕ. При публикации порта
      # postfix видит адресом источника шлюз сети docker, то есть частный
      # адрес. Частные адреса — ровно те, что чаще всего попадают в mynetworks
      # и получают право релея. Если приёмник отказал такому клиенту, то
      # публичному он откажет тем более: обратного случая не бывает.
      - "${MAIL_MX_BIND:-0.0.0.0}:25:25"
      # SUBMISSION (шаг C). По умолчанию привязан к петле ВНУТРИ контейнера —
      # то есть недостижим ниоткуда, включая сеть compose. Порт при этом
      # настроен и готов: включение сводится к трём действиям, и все три
      # обязаны произойти вместе, иначе получится либо дыра, либо тишина:
      #   1. MAIL_SUBMISSION_BIND=0.0.0.0 и MAIL_SUBMISSION_PASSWORD в .env.production
      #   2. ufw allow 587/tcp
      #   3. сертификат, покрывающий mail.pxcheats.com (иначе TLS не поднимется,
      #      а на 587 он обязателен)
      - "${MAIL_SUBMISSION_BIND:-127.0.0.1}:587:587"
    environment:
      MAIL_ROLE: mx
      MAIL_DOMAIN: ${MAIL_DOMAIN:-pxcheats.com}
      # Приёмник представляется тем именем, по которому его нашли, — значением
      # записи MX. У отправителя имя другое и меняться не должно.
      MAIL_MX_HOSTNAME: ${MAIL_MX_HOSTNAME:-mail.${MAIL_DOMAIN:-pxcheats.com}}
      # Куда пересылать. Личная почта владельца — поэтому значение живёт в
      # .env.production, а не в карте адресов в репозитории.
      #
      # Пусто оставлять нельзя — контейнер откажется стартовать с понятной
      # строкой в журнале. Проверку «пусто» здесь НЕ делаем через ${VAR:?}:
      # compose разворачивает переменные во ВСЁМ файле, независимо от
      # профилей, и такая запись сломала бы `docker compose config` даже там,
      # где почта вообще не поднимается. Отсутствие переменной ловит deploy.sh.
      MAIL_FORWARD_TO: ${MAIL_FORWARD_TO:-}
      MAIL_SUBMISSION_USER: ${MAIL_SUBMISSION_USER:-support}
      # Пусто — значит войти на 587 нельзя ничем, и отправить через него
      # тоже нельзя ничего.
      MAIL_SUBMISSION_PASSWORD: ${MAIL_SUBMISSION_PASSWORD:-}
    volumes:
      # Тот же сертификат, что у nginx и у отправителя. Отдельный сертификат
      # для почты — это отдельное продление, которое однажды забудут.
      - ./docker/nginx/certs:/etc/postfix/certs:ro
      # Очередь переживает пересоздание контейнера. Для приёмника это важнее,
      # чем для отправителя: там письма наши и повторятся из таблицы
      # notifications, а здесь чужие — потерять их некому будет объяснить.
      - postfix_mx_spool:/var/spool/postfix
    depends_on:
      # Нужен только службе submission (порт 25 подписывать нечего — см.
      # smtpd_milters= в conf/mx/main.cf), но зависимость объявлена всё равно:
      # иначе включение submission потребует ещё и не забыть про порядок
      # запуска.
      #
      # service_started, а не service_healthy: на порту 25 милтера нет вовсе,
      # и «не поднимать приёмник, потому что подписант не отчитался о
      # здоровье» означало бы отказ в приёме почты из-за детали, которая к
      # приёму не относится. Порт 25 — единственный публичный вход домена.
      opendkim:
        condition: service_started
    # 128 МБ, а не 96: default_process_limit у роли mx снижен до 8, но в пике
    # это всё равно ~25 процессов postfix (smtpd + cleanup + smtp + tlsproxy +
    # qmgr + anvil + master). Запас дешевле, чем OOM в приёмнике, который
    # выглядит как «письма от клиентов иногда не доходят».
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  #  Подпись DKIM. Отдельным контейнером, а не вторым процессом внутри postfix:
  #  упавший демон рядом с `postfix start-fg` умирает МОЛЧА, и письма уходят
  #  неподписанными — самая дорогая из тихих поломок. Здесь его перезапустит
  #  docker, а до перезапуска postfix ответит API кодом 4xx и письмо подождёт.
  # ---------------------------------------------------------------------------
  opendkim:
    image: lp-opendkim:local
    build:
      context: ./docker/mail/opendkim
      dockerfile: Dockerfile
    container_name: lp-opendkim
    restart: always
    profiles: ["mail"]
    environment:
      MAIL_DOMAIN: ${MAIL_DOMAIN:-pxcheats.com}
      # Имя переменной намеренно НЕ DKIM_SELECTOR: та переменная в
      # .env.production включает подпись в nodemailer и обязана оставаться
      # пустой — иначе на письме окажутся ДВЕ подписи одного селектора,
      # из которых проверится одна.
      MAIL_DKIM_SELECTOR: ${MAIL_DKIM_SELECTOR:-mail}
      # Подписываются письма только от этих адресов; всё прочее opendkim
      # лишь проверяет. Значение то же, что mynetworks у роли out.
      MAIL_INTERNAL_NETWORKS: ${MAIL_INTERNAL_NETWORKS:-127.0.0.0/8 172.16.0.0/12}
    volumes:
      # ЗАКРЫТЫЙ КЛЮЧ. Смонтирован ТОЛЬКО СЮДА и ТОЛЬКО ДЛЯ ЧТЕНИЯ.
      #
      # :ro стало возможно потому, что entrypoint делает рабочую КОПИЮ ключа
      # с нужными правами, а не chown прямо на смонтированном файле. Прежний
      # образ делал именно chown — из-за чего :ro отправлял контейнер в вечный
      # перезапуск с одной строкой «Read-only file system».
      #
      # Ключ ПОСТОЯННЫЙ и лежит в .secrets/dkim-private.pem: генерировать его
      # при каждом создании контейнера нельзя, потому что открытая часть
      # опубликована в mail._domainkey.pxcheats.com и после первой же выкладки
      # перестала бы соответствовать закрытой. Выглядело бы это как «письма
      # опять в спаме», без единой ошибки в журналах.
      - ./.secrets/dkim-private.pem:/etc/opendkim/keys/dkim.private:ro
    mem_limit: 48m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    # Профиль снят: в бою API — обычный сервис, а не опция.
    profiles: !override []
    restart: always
    env_file: .env.production
    environment:
      NODE_ENV: production
      APP_PORT: 3000
      # Пул libuv: Argon2 при входе и AES-GCM при выдаче payload уходят
      # на один пул. На одном ядре это очередь, но короткая.
      UV_THREADPOOL_SIZE: 8
      # Куча V8 меньше лимита контейнера: внешние Buffer'ы этот флаг не
      # считает, и разница между ними — как раз запас под тела payload.
      NODE_OPTIONS: --max-old-space-size=384
    mem_limit: 576m
    logging:
      # Без ограничения журнал контейнера растёт бесконечно и однажды
      # съедает диск целиком — на 30 ГБ это вопрос месяцев.
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  nginx:
    restart: always
    ports: !override
      - "80:80"
      - "443:443"
    environment:
      # В бою API живёт в той же сети, а не на хосте.
      API_UPSTREAM: api:3000
    depends_on:
      api:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # Выпуск и продление сертификата. Запускается по требованию:
  #   docker compose ... run --rm certbot
  # Автопродление вешается на cron, см. scripts/deploy.sh.
  certbot:
    image: certbot/certbot:latest
    container_name: lp-certbot
    profiles: ["certbot"]
    # Домен и почта берутся ИЗ ФАЙЛА, а не из окружения вызывающего.
    # Причина: в entrypoint ниже стоит $$, то есть подстановка отключена на
    # уровне compose и переменные разворачивает оболочка ВНУТРИ контейнера —
    # а туда переменные хоста не попадают. Без env_file certbot получал
    # пустую строку после --email и падал на «expected one argument».
    env_file: .env.production
    volumes:
      - ./docker/nginx/certbot:/var/www/certbot
      - ./docker/nginx/letsencrypt:/etc/letsencrypt
      - ./docker/nginx/certs:/certs
    # Проверка владения доменом идёт по HTTP через nginx, который отдаёт
    # /.well-known/acme-challenge/ из общего каталога. Поэтому 80 остаётся
    # открытым даже когда включён HTTPS — иначе сертификат нечем продлить.
    # ЧТО К ПРОБЛЕМЕ ВЕЛО: у продолжений команды был БОЛЬШИЙ отступ, чем у
    # первой строки. В свёрнутом блоке YAML (>) строки склеиваются пробелами
    # только при ОДИНАКОВОМ отступе; более глубокие сохраняются как есть,
    # вместе с переводами строк. Оболочка получала «--non-interactive»
    # отдельной командой и отвечала «not found», а до certbot не доезжал
    # даже --agree-tos — он спрашивал про условия использования и падал
    # с EOFError, потому что терминала нет. Выглядело как «DNS не разошёлся».
    #
    # Отступ здесь обязан оставаться ровным. Проверять после любой правки.
    entrypoint: >
      sh -c "
      certbot certonly --webroot -w /var/www/certbot
      --non-interactive --agree-tos
      --email $${CERTBOT_EMAIL}
      -d $${CERTBOT_DOMAIN} -d s3.$${CERTBOT_DOMAIN}
      --keep-until-expiring &&
      cp -L /etc/letsencrypt/live/$${CERTBOT_DOMAIN}/fullchain.pem /certs/fullchain.pem &&
      cp -L /etc/letsencrypt/live/$${CERTBOT_DOMAIN}/privkey.pem /certs/privkey.pem &&
      echo 'сертификат на месте'
      "

# ============================================================================
#  Тома, которых нет в базовом файле.
# ============================================================================
volumes:
  # Очередь публичного приёмника. Переживает пересоздание контейнера:
  # письма здесь ЧУЖИЕ, повторить их из таблицы notifications, как свои,
  # невозможно, а отправитель об их пропаже не узнает — он получил 250.
  postfix_mx_spool:

  # Очередь отправителя. Раньше её не было — считалось, что письма роли «out»
  # живут в базе со статусом PENDING и уйдут заново.
  #
  # ЧТО К ПРОБЛЕМЕ ВЕЛО: обработчик уведомлений ставит SENT в момент, когда
  # postfix ответил 250, то есть когда письмо только принято в очередь. Всё,
  # что уже принято, но ещё не доставлено, повторить из базы НЕЛЬЗЯ: такие
  # строки числятся отправленными. Пересоздание контейнера уничтожало их
  # молча — и чаще всего именно при выкладке, то есть в момент, когда почте
  # и так труднее всего.
  postfix_out_spool:
