# ============================================================================
#  Настройка Cyrus SASL для smtpd. Postfix ищет этот файл как
#  /etc/postfix/sasl/<smtpd_sasl_path>.conf — отсюда и имя smtpd.conf.
#
#  Проверка пароля идёт по локальной базе sasldb2, без saslauthd. Причина:
#  saslauthd — ещё один демон в контейнере, который может умереть молча, а
#  проверять нам нужно ровно одну учётку.
# ============================================================================

# auxprop — «вспомогательные свойства»: пароль берётся из базы, а не
# спрашивается у внешней службы.
pwcheck_method: auxprop
auxprop_plugin: sasldb

# Путь задан ЯВНО. По умолчанию Cyrus ищет /etc/sasldb2, но smtpd работает
# от пользователя postfix и с рабочим каталогом /var/spool/postfix —
# отлаживать «почему не читается» дешевле, когда путь написан.
sasldb_path: /etc/postfix/sasl/sasldb2

# Только PLAIN и LOGIN: оба передают пароль в открытом виде ВНУТРИ уже
# поднятого TLS (smtpd_tls_auth_only = yes, а на 587 ещё и
# smtpd_tls_security_level = encrypt). CRAM-MD5 и DIGEST-MD5 не предлагаем —
# они требуют хранить пароль в обратимом виде и давно считаются слабыми.
mech_list: PLAIN LOGIN
