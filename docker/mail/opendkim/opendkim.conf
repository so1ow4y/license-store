# ============================================================================
#  Подпись DKIM для pxcheats.com, селектор mail.
#
#  ЭТИ ТРИ ВЕЩИ МЕНЯТЬ НЕЛЬЗЯ БЕЗ ПРАВКИ DNS: домен, селектор и сам ключ.
#  Открытая часть ключа опубликована в mail._domainkey.pxcheats.com, и
#  расхождение выглядит не как ошибка, а как «письма опять в спаме».
#
#  Значения, помеченные [entrypoint], подставляются при старте —
#  см. docker/mail/opendkim/entrypoint.sh.
# ============================================================================

# Журнал уходит в syslog (другого у opendkim нет), а syslog в этом контейнере
# перекладывает записи в stdout — см. Dockerfile.
Syslog                  yes
SyslogSuccess           yes
# Объясняет причину отказа подписывать/проверять. Строк немного (у нас
# единицы писем в минуту), а без них отладка сводится к гаданию.
LogWhy                  yes

# Не уходить в фон: процесс должен быть первым в контейнере, чтобы docker
# видел его смерть и перезапускал контейнер.
Background              no
PidFile                 /var/run/opendkim/opendkim.pid

# Права сбрасываются с root до opendkim сразу после открытия сокета.
UserID                  opendkim
UMask                   007

# Слушаем по TCP, а не через unix-сокет: клиентов двое и оба в соседних
# контейнерах. Слушать 0.0.0.0 безопасно — порт наружу не публикуется,
# достучаться можно только из сети compose.
Socket                  inet:8891@0.0.0.0

# s — подписывать, v — проверять. Проверка нужна не ради фильтрации (её
# делает Gmail), а ради вывода в журнал: по строке «verification failed»
# сразу видно, что кто-то подделывается под наш домен.
Mode                    sv

# relaxed для заголовков — терпимо к переносам и лишним пробелам, которые
# промежуточные серверы добавляют почти всегда; simple для тела — тело в
# пути не меняется, а simple быстрее и проще проверяется.
Canonicalization        relaxed/simple

# [entrypoint: MAIL_DOMAIN / DKIM_SELECTOR]
#
# Простая форма (Domain/Selector/KeyFile) вместо KeyTable+SigningTable
# намеренно: домен один, селектор один, ключ один. Две таблицы ради одной
# записи — это два файла, которые могут разойтись.
Domain                  pxcheats.com
Selector                mail
KeyFile                 /var/lib/opendkim/keys/dkim.private

# Поддомены не подписываем: писем от них нет, а подпись домена под чужой
# поддомен — лишняя поверхность.
SubDomains              no

# Ключ обязан лежать с безопасными правами. entrypoint кладёт рабочую копию
# как opendkim:opendkim 0400 — исходный файл при этом остаётся у root и
# монтируется только для чтения.
RequireSafeKeys         yes
MinimumKeyBits          1024

# Подписываем From дважды: без этого посредник может ДОБАВИТЬ второй заголовок
# From, который почтовые клиенты покажут пользователю, а подпись останется
# верной для первого. Классическая атака подмены отправителя на уцелевшей
# подписи.
OversignHeaders         From

# --- Кого считаем «своим» ---------------------------------------------------
#
# ЭТО САМАЯ НЕОЧЕВИДНАЯ ЧАСТЬ ФАЙЛА, и ошибка здесь стоит дорого.
#
# opendkim ПОДПИСЫВАЕТ только письма от клиентов из InternalHosts; для всех
# прочих он их ПРОВЕРЯЕТ. При этом milter получает IP ИСХОДНОГО SMTP-КЛИЕНТА,
# а не подключившегося к нему postfix. Отсюда:
#
#   письмо от API (адрес из подсети compose)  → внутренний → подписывается
#   письмо из интернета на порт 25            → внешний    → не подписывается
#                                                (и правильно: пересылаемый
#                                                 спам не должен уезжать в
#                                                 Gmail с нашей репутацией)
#
# Список НЕ ДАЁТ РЕЛЕЯ: opendkim вообще не участвует в решении «кому
# доставлять», он только подписывает.
#
# [entrypoint: MAIL_INTERNAL_NETWORKS] — файл собирается при старте.
InternalHosts           refile:/var/lib/opendkim/InternalHosts

# --- Подпись писем, отправленных через submission (порт 587) ----------------
#
# ВЫКЛЮЧЕНО СОЗНАТЕЛЬНО, ВКЛЮЧАЕТСЯ НА ШАГЕ C.
#
# Проблема: клиент submission (например, серверы Gmail при «отправлять как»)
# приходит с ЧУЖОГО публичного адреса, которого нет и не может быть в
# InternalHosts. По правилу выше его письмо подписано не будет.
#
# Решение: postfix помечает соединение макросом (см. -o
# milter_macro_daemon_name=ORIGINATING в conf/mx/master.cf), а opendkim
# подписывает всё, что этим макросом помечено, независимо от адреса.
#
# Почему строка закомментирована. Она не проверена живьём, а неизвестная
# директива для opendkim — фатальная ошибка запуска: демон не поднимется,
# postfix упрётся в milter_default_action=tempfail, и ОТПРАВКА ПЛАТФОРМЫ
# ВСТАНЕТ. Ради непроверенной строки рисковать работающей отправкой нельзя.
#
# Порядок включения на шаге C:
#   1. снять решётку со строки ниже;
#   2. docker compose ... up -d --build opendkim
#   3. docker logs lp-opendkim — демон должен подняться без «unknown keyword»;
#   4. только после этого публиковать порт 587.
# Откат — вернуть решётку и пересоздать контейнер.
#
# MacroList             daemon_name=ORIGINATING
