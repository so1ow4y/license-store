# ============================================================================
#  Общая часть server-блоков: прокси-заголовки, обработчики ошибок и все
#  маршруты. Подключается и из HTTP (default.conf), и из HTTPS (tls.conf).
#
#  Вынесено, чтобы 80 и 443 не разъехались. Продублируй мы это копией —
#  первая же правка лимита или таймаута легла бы в один блок и забылась
#  во втором, а разница между «по HTTP работает, по HTTPS нет» ищется долго.
# ============================================================================

    # --- Блок на краю (уровни «nginx» и «фаервол») ---------------
    #
    # Server-level `if` срабатывает до выбора location: заблокированный
    # адрес не доходит ни до API, ни до статики. Внутренний переход на
    # /__edge_blocked вместо `return` — чтобы ответ был JSON той же формы,
    # что у приложения: default_type в `if` уровня server не задаётся.
    # Список — $lp_edge_blocked из default.conf.template.
    if ($lp_edge_blocked) {
        rewrite ^ /__edge_blocked last;
    }

    # --- Проксирование --------------------------------------------
    # Эти заголовки — то, ради чего nginx стоит держать и локально.
    # Без X-Forwarded-For приложение видит адрес контейнера nginx,
    # и антифрод считает всех пользователей одним.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;

    # X-Forwarded-For ПЕРЕЗАПИСЫВАЕТСЯ, а не дополняется.
    # $proxy_add_x_forwarded_for сохранил бы значение, присланное клиентом,
    # и дописал настоящий адрес справа, а приложение поднято с
    # trustProxy: true и берёт ЛЕВЫЙ элемент цепочки. То есть в журнал
    # выдач, в anti_fraud_events, в devices.last_ip и licenses.last_check_ip
    # ложилось бы то, что пользователь написал сам одним заголовком.
    # Корреляция по IP — единственный инструмент, ради которого журнал
    # выдач и заводится, поэтому источник адреса здесь ровно один: сокет.
    #
    # Это верно, ПОКА nginx стоит крайним. Как только перед ним появится
    # CDN или облачный балансировщик, $remote_addr станет адресом прокси,
    # и ДО любых limit_req понадобится real_ip — иначе (а) каждая зона
    # схлопнется в общий лимит на весь сервис (все запросы с одного
    # адреса), (б) в журналах окажется адрес прокси:
    #
    #   set_real_ip_from  10.0.0.0/8;     # ТОЛЬКО сети доверенного прокси
    #   real_ip_header    X-Forwarded-For;
    #   real_ip_recursive on;
    #
    # Включать real_ip, пока nginx крайний, НЕЛЬЗЯ: это тот же подлог
    # адреса, только сделанный нашими руками.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $request_id;
    proxy_set_header Connection        "";

    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # Ошибки приложения приходят готовым конвертом {statusCode, code,
    # message, requestId, timestamp} — подменять их заглушками nginx нельзя.
    # Значение и так по умолчанию off, записано явно, потому что error_page
    # ниже без этой строки читается как «перехватываем всё подряд».
    proxy_intercept_errors off;

    # Синтетический 429 отдаём JSON'ом той же формы: клиент разбирает тело
    # как ApiErrorBody, и HTML-страница nginx превращается у него
    # в «неизвестную ошибку» — сработавший лимит выглядит как поломка
    # сервера, а не как лимит.
    error_page 429 = @json429;

    # То же самое для остальных ошибок самого nginx. Проверено фактом:
    # POST /api/v1/launcher/payload телом в 20000 байт отдавал
    # Content-Type: text/html и страницу «413 Request Entity Too Large»,
    # то есть загрузчик на превышении размера тела и на недоступном
    # апстриме (502/504 достижимы) видел «неизвестную ошибку».
    #
    # Две тонкости записи, обе проверены на живом nginx, а не выведены:
    #
    # 1. БЕЗ «=». Так сохраняется исходный код ответа, а тело берётся из
    #    указанного location. У @json429/@json503 «=» есть потому, что там
    #    код задаёт сам return.
    # 2. Обычный URI, а НЕ именованный location. На ошибках, которые
    #    возникают ДО разбора строки запроса (414, 431, часть 400), URI
    #    запроса ещё не известен, и переход в @-location падает:
    #      [error] empty URI in redirect to named location "@jsonerr"
    #      while reading client request line
    #    клиент при этом получает 500 HTML — хуже, чем было. Внутренний
    #    редирект на /__jsonerr от исходного URI не зависит и отрабатывает.
    #
    # Ответы ПРИЛОЖЕНИЯ это не трогает: при proxy_intercept_errors off
    # error_page к статусам от бэкенда не применяется, и 400 с details
    # от ValidationPipe доходит до клиента как есть.
    error_page 400 405 408 413 414 431 500 501 502 504 /__jsonerr;

    # --- Аутентификация: самый жёсткий лимит ----------------------
    #
    # verify-email попал сюда вместе с повторной отправкой письма
    # (verify-email/resend): без якоря конца строки шаблон покрывает оба.
    # Эндпоинт, который ОТПРАВЛЯЕТ ПИСЬМО постороннему адресу, в общей зоне
    # с тремя сотнями запросов в минуту — это готовая рассылка от нашего
    # имени. В приложении своя пауза на аккаунт, но она считает по аккаунту,
    # а эта зона — по адресу отправителя запроса; вместе они закрывают и
    # заваливание одного ящика, и веерный перебор адресов.
    location ~ ^/api/v\d+/auth/(login|register|password-reset|verify-email) {
        limit_req zone=auth_zone burst=5 nodelay;
        proxy_pass http://api_upstream;
    }

    # --- Payload §7: единственный бинарный ответ в API -------------
    #
    # Объявлен ВЫШЕ общего /launcher/ намеренно: регулярные location
    # проверяются в порядке объявления, и общий перехватил бы запрос
    # первым. Директивы из соседнего location не наследуются, поэтому
    # limit_req здесь повторён целиком, а не «унаследован».
    location ~ ^/api/v\d+/launcher/payload$ {
        # Лимит по адресу — грубый антифлуд, и другого ключа у nginx нет:
        # лицензию он не видит. Ставка намеренно не ниже launcher_zone.
        # payload — ОДИН запрос на запуск, а за одним NAT (общежитие,
        # интернет-кафе, CGNAT мобильного оператора) вечером запускаются
        # десятки человек и выбивают порог друг у друга. Осмысленный порог
        # (20 мягкий / 60 жёсткий выдач в час на ЛИЦЕНЗИЮ) живёт в
        # приложении, где известен субъект; здесь — только потолок
        # злоупотребления с большим запасом.
        limit_req zone=payload_zone burst=20 nodelay;

        # 503, а не 429. По ТЗ §2.3 клиент 429 повторять НЕ ИМЕЕТ ПРАВА:
        # сетевой лимит, сработавший на нормальном поведении, стал бы
        # терминальным экраном у невиновного пользователя, из которого
        # он сам не выйдет. 503 повторяется с экспоненциальной задержкой —
        # ровно нужная семантика для временной перегрузки.
        limit_req_status 503;
        error_page 503 = @json503;

        # Список повторён здесь целиком, а не унаследован: error_page
        # наследуется из server ТОЛЬКО если в location нет ни одной своей
        # директивы error_page. Строка выше её создаёт — и без повторения
        # именно этот location, единственный с client_max_body_size 8k,
        # остался бы с HTML-страницей на 413.
        error_page 429 = @json429;
        error_page 400 405 408 413 414 431 500 501 502 504 /__jsonerr;

        # Тело запроса — три коротких поля, среди которых sessionKey,
        # то есть ключ к содержимому ответа. Буферизация ЗАПРОСА
        # оставлена включённой сознательно: она защищает воркер Node
        # от медленного клиента, растягивающего отправку тела. Размеры
        # подобраны так, чтобы тело гарантированно помещалось в память
        # и не уезжало во временный файл — секрет сессии на диске
        # не лучше самого payload'а на диске.
        proxy_request_buffering on;
        client_max_body_size    8k;
        client_body_buffer_size 16k;

        # ГЛАВНОЕ. С буферизацией ответа многомегабайтное тело уезжает
        # во ВРЕМЕННЫЙ ФАЙЛ nginx, то есть payload физически оказывается
        # на диске нашего сервера — ровно то, что ТЗ §7 и §11.3 запрещают
        # на клиенте, просто на другом конце провода. Нарушение
        # незаметное: обнаруживается только осмотром /var/cache/nginx.
        #
        # Цена решения (записана честно): при выключенной буферизации
        # воркер Node держится всё время слива клиенту, а с ним и слот
        # байтового бюджета выдач — на узком канале это секунды на запрос.
        # Если пропускная упрётся в это раньше, чем в память, допустима
        # обратная настройка — буферизация в ПАМЯТИ без временного файла:
        #     proxy_buffering on; proxy_buffers 64 64k;
        #     proxy_busy_buffers_size 128k; proxy_max_temp_file_size 0;
        # Запрет временного файла обязателен в обоих вариантах.
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_cache off;

        # Формально избыточно (application/octet-stream не входит в
        # gzip_types), но ставится явно: расширение списка типов не должно
        # однажды включить сжатие шифротекста.
        gzip off;

        # 60s вместо общих 30s — под потолок размера ответа на узком
        # канале. send_timeout здесь не менее важен: с выключенной
        # буферизацией темп задаёт клиент, и таймаут записи КЛИЕНТУ —
        # это то, что не даёт зависшему приёмнику держать воркер.
        proxy_read_timeout 60s;
        send_timeout       60s;

        # no-store обязан дойти до клиента при ЛЮБОМ исходе, включая
        # ошибки. Заголовок сначала снимается, потом ставится заново:
        # add_header поверх пришедшего от приложения дал бы два одинаковых
        # заголовка вместо одного, а проверка контракта ждёт ровно один.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;

        proxy_pass http://api_upstream;
    }

    # --- Launcher API: частые, но дешёвые проверки лицензии --------
    location ~ ^/api/v\d+/launcher/ {
        limit_req zone=launcher_zone burst=30 nodelay;
        proxy_pass http://api_upstream;
    }

    # --- Остальное API --------------------------------------------
    location /api/ {
        limit_req zone=api_zone burst=50 nodelay;
        proxy_pass http://api_upstream;
    }

    # --- Пробы ------------------------------------------------------
    # Без ограничения скорости и без записи в лог: балансировщик
    # опрашивает их постоянно, и в логе от них один шум.
    location /health/ {
        access_log off;
        proxy_pass http://api_upstream;
    }

    # --- OpenAPI ----------------------------------------------------
    # Только для разработки. На проде этот блок убирается или закрывается
    # по IP: спецификация — готовая карта API для атакующего.
    location /docs {
        proxy_pass http://api_upstream;
    }

    # --- Фронтенд ---------------------------------------------------
    #
    # Одностраничное приложение: собранная статика из apps/web/dist.
    #
    # try_files с откатом на /index.html обязателен. Маршрутизация у SPA
    # клиентская, и на диске нет ни verify-email, ни reset-password — а
    # именно по этим адресам приходят люди ПО ССЫЛКЕ ИЗ ПИСЬМА, то есть
    # запросом к серверу, а не переходом внутри приложения. Без отката
    # nginx отдал бы им 404, и регистрацию завершить было бы нельзя.
    #
    # Блок стоит последним среди location: префикс «/» — самый общий, и
    # все API-пути выше него совпадают раньше по правилам nginx.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        # Хэш в имени файла делает содержимое неизменяемым: тот же адрес
        # всегда означает те же байты, поэтому кэшировать можно навсегда.
        location ~* \.(js|css|woff2?|svg|png|jpg|webp|ico)$ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable" always;
        }
    }

    # index.html кэшировать НЕЛЬЗЯ: он единственный ссылается на файлы с
    # новыми хэшами, и закэшированный у пользователя навсегда оставит его
    # на старой сборке — включая старый адрес API.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # --- Ошибки, сгенерированные самим nginx ------------------------
    # Форма тела совпадает с ApiErrorBody приложения, поэтому клиент
    # разбирает её тем же кодом и показывает пользователю осмысленный
    # текст вместо «неизвестной ошибки».
    #
    # $request_id — тот же идентификатор, что уезжает в приложение
    # заголовком X-Request-Id и пишется в лог nginx. Чтобы поддержка
    # находила по нему инцидент и в логах ПРИЛОЖЕНИЯ, genReqId в main.ts
    # обязан принимать входящий X-Request-Id, а не генерировать свой
    # безусловно — иначе идентификатор из окна ошибки не ищется нигде,
    # кроме access-лога.
    #
    # $time_iso8601 отличается от формата приложения смещением
    # (+00:00 вместо Z) — это разные представления одного момента,
    # разбираются одинаково.
    location @json429 {
        default_type application/json;
        add_header Retry-After 60 always;
        add_header Cache-Control "no-store" always;
        return 429 '{"statusCode":429,"code":"RATE_LIMITED","message":"Слишком много запросов, попробуйте позже","requestId":"$request_id","timestamp":"$time_iso8601"}';
    }

    location = /__edge_blocked {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 403 '{"statusCode":403,"code":"IP_BLOCKED","message":"Доступ с вашего адреса заблокирован","requestId":"$request_id","timestamp":"$time_iso8601"}';
    }

    location @json503 {
        default_type application/json;
        add_header Retry-After 5 always;
        add_header Cache-Control "no-store" always;
        return 503 '{"statusCode":503,"code":"SERVICE_UNAVAILABLE","message":"Сервис временно недоступен, повторите попытку","requestId":"$request_id","timestamp":"$time_iso8601"}';
    }

    # Общий обработчик остальных ошибок nginx. Код ответа сюда НЕ пишется
    # числом: он приходит из error_page без «=» и подставляется в тело через
    # $status, а карты выше переводят его в code и message словаря приложения.
    # 200 в return — не код ответа клиенту, а обязательный аргумент директивы:
    # статус остаётся тем, с которым запрос сюда пришёл (проверено: 413 и 414
    # доходят до клиента с 413 и 414, а не с 200).
    #
    # internal — чтобы этот путь нельзя было запросить снаружи и получить
    # осмысленный ответ там, где никакой ошибки не было.
    location = /__jsonerr {
        internal;
        default_type application/json;
        add_header Retry-After $lp_retry_after always;
        add_header Cache-Control "no-store" always;
        return 200 '{"statusCode":$status,"code":"$lp_error_code","message":"$lp_error_message","requestId":"$request_id","timestamp":"$time_iso8601"}';
    }
